<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Babel Standalone para JSX en navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Import Map para React y Lucide Icons -->
  <script type="importmap">
  {

<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen p-2 md:p-6">
  <!-- Contenedor principal de React -->
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Shield, Compass, Target, ArrowRight, ArrowLeft, CheckCircle2, 
      AlertTriangle, RefreshCw, Save, Trash2, Award, BookOpen, 
      FileText, Check, Activity, Flame, Zap, 
      RotateCcw, Copy, Sparkles, Loader2,
      Sliders, MessageSquare, Send, Bot, Printer, Download,
      Folder, FolderPlus, Volume2, Info, ShoppingBag, ExternalLink,
      BookMarked, CreditCard, Lock, CheckCircle
    } from 'lucide-react';

    // Helper seguro para llamadas a la API de Gemini 2.5 Flash
    const callGeminiAPI = async (prompt, systemInstruction = "") => {
      const apiKey = "";
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{ parts: [{ text: prompt }] }]
      };
      if (systemInstruction) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
      }

      let delay = 1000;
      for (let attempt = 0; attempt < 5; attempt++) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`Error de red: ${res.status}`);
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) return text;
          throw new Error("Respuesta vacía de la API.");
        } catch (err) {
          if (attempt === 4) throw err;
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2;
        }
      }
    };

    const SYSTEM_INSTRUCTION_FEXADEL = `Eres el copiloto virtual del Método FEXADEL de Fer Delgado (Autogobierno con Propósito).
Tu tono es directo, quirúrgico, profesional, sin lenguaje de autoayuda ni motivacional vacío.
Principios fundamentales:
1. Ayudar a distinguir hechos objetivos de interpretaciones o narrativas dramatizadas.
2. Identificar la causa raíz ("la X") que gobierna la conducta en secreto (miedos, mandatos, orgullo).
3. Desmontar excusas mediante contrapreguntas disruptivas y exigir planes concretos, específicos y medibles.`;

    const ETAPAS = [
      { id: 1, key: 'F', nombre: 'Frenar', subtitulo: 'Generar confianza y salir del ruido', icon: Shield, color: 'text-sky-400 bg-sky-950/50 border-sky-800' },
      { id: 2, key: 'E', nombre: 'Entender', subtitulo: 'Separar hechos de interpretaciones', icon: Compass, color: 'text-indigo-400 bg-indigo-950/50 border-indigo-800' },
      { id: 3, key: 'X', nombre: 'Encontrar la X', subtitulo: 'Detectar la raíz que te está gobernando', icon: Target, color: 'text-amber-400 bg-amber-950/50 border-amber-800' },
      { id: 4, key: 'A', nombre: 'Afirmar', subtitulo: 'Reconstruir percepción con evidencia', icon: Award, color: 'text-emerald-400 bg-emerald-950/50 border-emerald-800' },
      { id: 5, key: 'D', nombre: 'Desmontar', subtitulo: 'Trabajar miedos y autosabotaje', icon: Flame, color: 'text-rose-400 bg-rose-950/50 border-rose-800' },
      { id: 6, key: 'E', nombre: 'Ejecutar', subtitulo: 'Crear un plan posible y medible', icon: Zap, color: 'text-blue-400 bg-blue-950/50 border-blue-800' },
      { id: 7, key: 'L', nombre: 'Liderarse', subtitulo: 'Decidir, evaluar y recalibrar', icon: Activity, color: 'text-purple-400 bg-purple-950/50 border-purple-800' }
    ];

    const BARRERAS_MAP = {
      'Miedo al rechazo o fracaso': '«¿Qué es exactamente lo que se destruye si fracasas en este intento, tu vida o solo tu ego?»',
      'Procrastinación por perfeccionismo': '«¿Buscar el momento perfecto te está protegiendo o te está manteniendo en la cobardía de no ser juzgado?»',
      'Sentimiento de culpa o autosabotaje': '«¿Castigarte en el presente repara algo del pasado o solo te excusa de actuar hoy?»',
      'Dependencia de la aprobación externa': '«¿Quién está dirigiendo tu vida si la opinión ajena define tu siguiente paso?»',
      'Parálisis por exceso de análisis': '«¿Necesitas más información o lo que te falta es asumir la responsabilidad del riesgo?»'
    };

    // Catálogo oficial de eBooks
    const LIBROS_PREMIUM_INICIALES = [
      {
        id: 'libro-1',
        titulo: 'Cuando todo se va a la mierda',
        subtitulo: 'Guía práctica de autogobierno y claridad en momentos de crisis profunda',
        formato: 'eBook Digital (PDF & ePub)',
        precio: 'Checkout Oficial',
        badge: 'Hotmart',
        puntosClave: [
          'Herramientas para mantener el temple cuando la vida se desmorona.',
          'Cómo salir de la parálisis y la confusión en situaciones límite.',
          'Paso a paso para tomar decisiones conscientes sin pánico.'
        ],
        linkPago: 'https://pay.hotmart.com/W106168968U'
      },
      {
        id: 'libro-2',
        titulo: 'El hombre que no se arrodilla',
        subtitulo: 'Recupera tu firmeza, carácter y soberanía ante las presiones del entorno',
        formato: 'eBook Digital (PDF & ePub)',
        precio: 'Checkout Oficial',
        badge: 'Hotmart',
        puntosClave: [
          'Cómo dejar de vivir para complacer o ceder ante el chantaje emocional.',
          'Principios de soberanía personal y carácter en relaciones y trabajo.',
          'Estrategias directas para mantenerte firme en tus decisiones.'
        ],
        linkPago: 'https://pay.hotmart.com/T106280283B'
      }
    ];

    const INITIAL_FORM_DATA = {
      idCaso: Date.now(),
      tituloCaso: 'Caso Actual de Autogobierno',
      situacion: '',
      emocionesDominantes: [],
      safetyAlert: false,
      hechosObjetivos: '',
      miInterpretacion: '',
      perspectivaAlternativa1: '',
      perspectivaAlternativa2: '',
      sintomaVisible: '',
      preguntaSubyacente: '',
      xRaiz: '',
      creenciaHeredada: '',
      esTuyoOAprendido: 'aprendido',
      trampolinAprendizaje: '',
      evidenciaCapacidadPasada: '',
      barreraSeleccionada: 'Miedo al rechazo o fracaso',
      otraBarrera: '',
      respuestaContrapregunta: '',
      planQue: '',
      planCuando: '',
      planComo: '',
      planHito: '',
      estadoEjecucion: 'pendiente',
      evidenciaX: '',
      reajusteX: ''
    };

    const INITIAL_PILARES = {
      relaciones: 5,
      trabajo: 5,
      finanzas: 5,
      futuro: 5
    };

    function App() {
      const [tabActiva, setTabActiva] = useState('proceso');
      const [pasoActual, setPasoActual] = useState(1);
      
      // Manejo seguro de LocalStorage para Google Sites (IFrame friendly)
      const safeGetStorage = (key, fallback) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : fallback;
        } catch (e) {
          return fallback;
        }
      };

      const safeSetStorage = (key, val) => {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      };

      const [formData, setFormData] = useState(() => safeGetStorage('fexadel_active_session', INITIAL_FORM_DATA));
      const [listaCasos, setListaCasos] = useState(() => safeGetStorage('fexadel_lista_casos', []));
      const [pilares, setPilares] = useState(() => safeGetStorage('fexadel_pilares', INITIAL_PILARES));
      const [bitacora, setBitacora] = useState(() => safeGetStorage('fexadel_bitacora', []));
      const [libros] = useState(LIBROS_PREMIUM_INICIALES);

      // Modales y Notificaciones
      const [modalConfirm, setModalConfirm] = useState({ show: false, title: '', message: '', onConfirm: null });
      const [toastMsg, setToastMsg] = useState({ show: false, text: '', type: 'info' });
      const [modalPago, setModalPago] = useState({ show: false, libro: null });

      // Estado de IA Gemini
      const [loadingAI, setLoadingAI] = useState(null);
      const [aiError, setAiError] = useState('');
      const [auditoriaFeedback, setAuditoriaFeedback] = useState('');
      const [escanerDiagnostico, setEscanerDiagnostico] = useState('');

      // Copiloto Chat
      const [chatMessages, setChatMessages] = useState([
        { role: 'assistant', text: 'Hola. Soy el Copiloto FEXADEL. ¿En qué situación o decisión estás sintiendo parálisis o falta de autogobierno en este momento?' }
      ]);
      const [inputChat, setInputChat] = useState('');
      const chatEndRef = useRef(null);

      useEffect(() => { safeSetStorage('fexadel_active_session', formData); }, [formData]);
      useEffect(() => { safeSetStorage('fexadel_lista_casos', listaCasos); }, [listaCasos]);
      useEffect(() => { safeSetStorage('fexadel_pilares', pilares); }, [pilares]);
      useEffect(() => { safeSetStorage('fexadel_bitacora', bitacora); }, [bitacora]);

      useEffect(() => {
        if (tabActiva === 'copiloto' && chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, tabActiva]);

      const indiceAutogobierno = useMemo(() => {
        const suma = pilares.relaciones + pilares.trabajo + pilares.finanzas + pilares.futuro;
        return Math.round((suma / 40) * 100);
      }, [pilares]);

      const pilarCritico = useMemo(() => {
        const items = [
          { nombre: 'Relaciones & Entorno', valor: pilares.relaciones, key: 'relaciones' },
          { nombre: 'Trabajo & Propósito', valor: pilares.trabajo, key: 'trabajo' },
          { nombre: 'Economía & Autonomía', valor: pilares.finanzas, key: 'finanzas' },
          { nombre: 'Futuro & Decisión Propia', valor: pilares.futuro, key: 'futuro' }
        ];
        return items.sort((a, b) => a.valor - b.valor)[0];
      }, [pilares]);

      const etapaActualInfo = useMemo(() => {
        return ETAPAS.find(e => e.id === pasoActual) || ETAPAS[0];
      }, [pasoActual]);

      const showToast = (text, type = 'info') => {
        setToastMsg({ show: true, text, type });
        setTimeout(() => setToastMsg({ show: false, text: '', type: 'info' }), 3500);
      };

      const updateField = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleEmocionToggle = (emocion) => {
        setFormData(prev => {
          const actual = prev.emocionesDominantes || [];
          const existe = actual.includes(emocion);
          return {
            ...prev,
            emocionesDominantes: existe 
              ? actual.filter(e => e !== emocion) 
              : [...actual, emocion]
          };
        });
      };

      const requestResetSession = () => {
        setModalConfirm({
          show: true,
          title: '¿Reiniciar Proceso Actual?',
          message: 'Esta acción limpiará los campos de la sesión actual. Los casos guardados en tu bitácora se conservarán intactos.',
          onConfirm: () => {
            setFormData({ ...INITIAL_FORM_DATA, idCaso: Date.now() });
            setPasoActual(1);
            setAuditoriaFeedback('');
            setModalConfirm({ show: false, title: '', message: '', onConfirm: null });
            showToast('Proceso reiniciado correctamente.', 'info');
          }
        });
      };

      const guardarCasoEnColeccion = () => {
        if (!formData.situacion && !formData.xRaiz) {
          showToast('Ingresa al menos la situación o la X Raíz antes de guardar este caso.', 'warning');
          return;
        }

        const nuevoCaso = {
          ...formData,
          fechaModificacion: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
        };

        setListaCasos(prev => {
          const existeIdx = prev.findIndex(c => c.idCaso === formData.idCaso);
          if (existeIdx >= 0) {
            const copia = [...prev];
            copia[existeIdx] = nuevoCaso;
            return copia;
          } else {
            return [nuevoCaso, ...prev];
          }
        });

        showToast('¡Caso guardado en tus registros personales!', 'success');
      };

      const cargarCaso = (caso) => {
        setFormData(caso);
        setPasoActual(1);
        setTabActiva('proceso');
        showToast(`Caso "${caso.tituloCaso || 'Sin título'}" cargado con éxito.`, 'info');
      };

      const borrarCaso = (idCaso) => {
        setModalConfirm({
          show: true,
          title: '¿Eliminar Caso Guardado?',
          message: '¿Estás seguro de que deseas eliminar este registro de tu lista?',
          onConfirm: () => {
            setListaCasos(prev => prev.filter(c => c.idCaso !== idCaso));
            setModalConfirm({ show: false, title: '', message: '', onConfirm: null });
            showToast('Caso eliminado de los registros.', 'info');
          }
        });
      };

      const hablarTexto = (texto) => {
        if (!('speechSynthesis' in window)) {
          showToast('Tu navegador no soporta lectura por voz.', 'warning');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
        showToast('Reproduciendo en voz alta...', 'info');
      };

      const handleDiagnosticoPilaresAI = async () => {
        setLoadingAI('escaner');
        setAiError('');
        try {
          const prompt = `Puntuaciones de Autogobierno del usuario (del 1 al 10):
- Relaciones & Entorno: ${pilares.relaciones}/10
- Trabajo & Propósito: ${pilares.trabajo}/10
- Economía & Autonomía: ${pilares.finanzas}/10
- Futuro & Decisión Propia: ${pilares.futuro}/10

Índice Global: ${indiceAutogobierno}%.
Pilar más crítico: ${pilarCritico.nombre} (${pilarCritico.valor}/10).

Entrega un análisis sintético en 3 párrafos breves:
1. Diagnóstico objetivo del estado actual.
2. La hipótesis de qué "X" o causa raíz suele gobernar cuando el pilar de ${pilarCritico.nombre} se debilita.
3. El primer movimiento estratégico recomendable para la Etapa 1.`;

          const text = await callGeminiAPI(prompt, SYSTEM_INSTRUCTION_FEXADEL);
          setEscanerDiagnostico(text.trim());
        } catch (err) {
          setAiError('No se pudo generar el análisis del escáner en este momento.');
        } finally {
          setLoadingAI(null);
        }
      };

      const handleGenerarAbanicoAI = async () => {
        if (!formData.situacion && !formData.hechosObjetivos) {
          showToast('Describe primero la situación o los hechos objetivos.', 'warning');
          return;
        }
        setLoadingAI('abanico');
        setAiError('');
        try {
          const prompt = `Situación descrita: ${formData.situacion || 'No especificada'}
Hechos objetivos: ${formData.hechosObjetivos || 'No especificados'}
Interpretación actual del usuario: ${formData.miInterpretacion || 'No especificada'}

Basado en la filosofía FEXADEL, genera exactamente 2 perspectivas alternativas objetivas, realistas y constructivas.
Responde strictly en formato JSON con la siguiente estructura:
{
  "perspectiva1": "...",
  "perspectiva2": "..."
}`;
          const raw = await callGeminiAPI(prompt, SYSTEM_INSTRUCTION_FEXADEL);
          const jsonMatch = raw.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (parsed.perspectiva1) updateField('perspectivaAlternativa1', parsed.perspectiva1);
            if (parsed.perspectiva2) updateField('perspectivaAlternativa2', parsed.perspectiva2);
            showToast('Perspectivas objetivas generadas.', 'success');
          } else {
            updateField('perspectivaAlternativa1', raw.slice(0, 180));
          }
        } catch (err) {
          setAiError('No se pudo conectar con el copiloto IA. Por favor intenta de nuevo.');
        } finally {
          setLoadingAI(null);
        }
      };

      const handleDetectarXRaizAI = async () => {
        if (!formData.sintomaVisible && !formData.situacion) {
          showToast('Indica tu síntoma visible o tu situación actual primero.', 'warning');
          return;
        }
        setLoadingAI('xRaiz');
        setAiError('');
        try {
          const prompt = `Situación del usuario: ${formData.situacion}
Síntoma visible: ${formData.sintomaVisible}
Lo que cree que hay debajo: ${formData.preguntaSubyacente}

Genera una única frase contundente y quirúrgica que exprese la causa raíz (La X) que está gobernando al usuario. 
Comienza con: "Me está gobernando..."
Ejemplo: "Me está gobernando el miedo a perder el control y la creencia de que si fracaso pierdo todo mi valor."`;
          const text = await callGeminiAPI(prompt, SYSTEM_INSTRUCTION_FEXADEL);
          const cleanText = text.replace(/^["']|["']$/g, '').trim();
          updateField('xRaiz', cleanText);
          showToast('X Raíz identificada.', 'success');
        } catch (err) {
          setAiError('Error al analizar la causa raíz con IA.');
        } finally {
          setLoadingAI(null);
        }
      };

      const handleGenerarContrapreguntaAI = async () => {
        setLoadingAI('contrapregunta');
        setAiError('');
        try {
          const prompt = `Barrera mental: ${formData.barreraSeleccionada}
Situación del usuario: ${formData.situacion || 'No especificada'}
X Raíz identificada: ${formData.xRaiz || 'No especificada'}

Formula una única Contrapregunta X corta, provocadora y directa al estilo Fer Delgado para desarmar la excusa o bloqueo mental del usuario. Debe hacerle ver la inconsistencia de su miedo.`;
          const text = await callGeminiAPI(prompt, SYSTEM_INSTRUCTION_FEXADEL);
          updateField('respuestaContrapregunta', `[Respuesta guiada por IA]: ${text.trim()}`);
          showToast('Contrapregunta disruptiva generada.', 'success');
        } catch (err) {
          setAiError('No se pudo generar la contrapregunta en este momento.');
        } finally {
          setLoadingAI(null);
        }
      };

      const handleAuditarPlanAI = async () => {
        if (!formData.planQue) {
          showToast('Define qué harás exactamente en tu Plan X antes de auditarlo.', 'warning');
          return;
        }
        setLoadingAI('auditoria');
        setAiError('');
        try {
          const prompt = `Plan X del usuario:
- QUÉ: ${formData.planQue}
- CUÁNDO: ${formData.planCuando}
- CÓMO: ${formData.planComo}
- HITO MEDIBLE: ${formData.planHito}

Evalúa quirúrgicamente este plan. ¿Es específico, posible y libre de ambigüedades? Da un diagnóstico de 3 líneas señalando posibles puntos ciegos o sugiriendo un ajuste para asegurar que no haya excusas de ejecución.`;
          const text = await callGeminiAPI(prompt, SYSTEM_INSTRUCTION_FEXADEL);
          setAuditoriaFeedback(text.trim());
          showToast('Auditoría completada.', 'success');
        } catch (err) {
          setAiError('No se pudo completar la auditoría del plan.');
        } finally {
          setLoadingAI(null);
        }
      };

      const handleEnviarChatAI = async (e) => {
        e.preventDefault();
        if (!inputChat.trim() || loadingAI === 'chat') return;

        const userMsg = inputChat.trim();
        setInputChat('');
        setChatMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setLoadingAI('chat');

        try {
          const prompt = `Historial breve: ${JSON.stringify(chatMessages.slice(-4))}
Usuario pregunta/comenta: ${userMsg}

X Raíz actual del usuario (si existe): ${formData.xRaiz || 'Sin definir'}
Situación del usuario: ${formData.situacion || 'Sin definir'}

Responde de forma concisa (máximo 120 palabras), directa y enfocado en la responsabilidad y autogobierno del usuario.`;

          const responseText = await callGeminiAPI(prompt, SYSTEM_INSTRUCTION_FEXADEL);
          setChatMessages(prev => [...prev, { role: 'assistant', text: responseText.trim() }]);
        } catch (err) {
          setChatMessages(prev => [...prev, { role: 'assistant', text: 'No pude procesar tu mensaje. Inténtalo de nuevo.' }]);
        } finally {
          setLoadingAI(null);
        }
      };

      const guardarEnBitacora = () => {
        if (!formData.xRaiz || !formData.planQue) {
          showToast('Completa al menos la Etapa 3 (Encontrar la X) y la Etapa 6 (Plan X).', 'warning');
          return;
        }

        const nuevoItem = {
          id: Date.now(),
          fecha: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }),
          xRaiz: formData.xRaiz,
          planQue: formData.planQue,
          planCuando: formData.planCuando,
          planComo: formData.planComo,
          planHito: formData.planHito,
          estado: formData.estadoEjecucion,
          evidenciaX: formData.evidenciaX,
          reajusteX: formData.reajusteX,
          situacionOriginal: formData.situacion
        };

        setBitacora(prev => [nuevoItem, ...prev]);
        guardarCasoEnColeccion();
        showToast('Plan X guardado en tu Bitácora y Colección.', 'success');
      };

      const copiarFichaAlPortapapeles = () => {
        const textoFicha = `
--- FICHA DE AUTOGOBIERNO METODO FEXADEL ---
Autoría: Fer Delgado · Autogobierno con Propósito
Caso: ${formData.tituloCaso || 'Sin título'}

1. SITUACIÓN / PUNTO DE PARTIDA:
${formData.situacion || 'No especificada'}

2. LA X ENCONTRADA (Causa raíz que estaba gobernando):
${formData.xRaiz || 'No identificada aún'}

3. RECONSTRUCCIÓN & TRAMPOLÍN:
- Creencia desmontada: ${formData.creenciaHeredada || 'N/A'}
- Trampolín de aprendizaje: ${formData.trampolinAprendizaje || 'N/A'}

4. PLAN X DE ACCIÓN:
- Qué: ${formData.planQue || 'N/A'}
- Cuándo: ${formData.planCuando || 'N/A'}
- Cómo: ${formData.planComo || 'N/A'}
- Hito Medible: ${formData.planHito || 'N/A'}

5. ESTADO DE AUTOGOBIERNO:
